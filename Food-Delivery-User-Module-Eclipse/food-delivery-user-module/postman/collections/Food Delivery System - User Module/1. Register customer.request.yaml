$kind: http-request
url: "{{baseUrl}}/api/users/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "Test Customer",
      "contactNo": "9876543210",
      "password": "testpass123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Customer created', function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) { pm.collectionVariables.set('userId', pm.response.json().userId); }
    language: text/javascript
order: 1000
