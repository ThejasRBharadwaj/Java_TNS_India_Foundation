$kind: http-request
url: "{{baseUrl}}/api/users/{{userId}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "deliveryAddress": "12 Example Road, Mysuru, Karnataka"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Order created', function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) { pm.collectionVariables.set('orderId', pm.response.json().orderId); }
    language: text/javascript
order: 9000
