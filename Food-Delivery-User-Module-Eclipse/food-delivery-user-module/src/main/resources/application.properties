spring.application.name=food-delivery-user-module
server.port=8080

# PostgreSQL connection. Override these environment variables for your local setup.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/food_delivery_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:learning}
spring.datasource.driver-class-name=org.postgresql.Driver

# Creates/updates tables from JPA entities. Use validate for production deployments.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Helpful API error details while developing
server.error.include-message=always
server.error.include-binding-errors=always
logging.level.com.example.fooddelivery=DEBUG
